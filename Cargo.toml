[package]
name = "kbike-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.13.2"
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-graphics = "0.8.2"
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", rev = "46d6b50", features = ["nrf52840", "s140",
  "ble-peripheral", "ble-gatt-server", "critical-section-impl", "defmt"] }
panic-probe = {version = "1.0.0", features = ["print-defmt"]}
sequential-storage = "8.0.2"
sh1106 = "0.5.0"
static_cell = "2.1.1"
toml-cfg = "0.2.0"
